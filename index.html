<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/estilos.css">
    <script src="./js/funks.js" defer></script>
    <title>Atividade_Layout-15/05/2026</title>
</head>
<body>
    <header>
        <div class="logo_header"><h1>Kiphomy</h1>  <div class="img_logo"></div></div>
       
        <nav>
            <form id="pesquisador">
                <input id="pesquisa" type="text" placeholder="Pesquise aqui">
                <button>Pesquisar</button>
            </form>
        </nav>
    </header>
    <section>
        <h2 id="nome_receita">_</h2>
    </section>
    <main>
        <div id="resultado_img">
            <img class="result_img" src="./assets/gifcarregando.gif" alt="imagem da comida">
            <div class="result_instrucoes">
                <p>Instruções</p>
                <ul>
                
                </ul>
            </div>
            <div class="result_ingredientes">
                <p>Ingredientes</p>
            </div>
        </div>
        <div id="resultado_infos">
            <Span>Dificultade:</Span>
            <p id="result_dificult">_</p>

            <Span>Culinária:</Span>
            <p id="result_culinaria">_</p>

            <Span>Tempo de Preparação:</Span>
            <p id="result_tempoprep">0m</p>


            <form id="selecionar_leitura">
                <input id="slct_img" type="radio" name="selecionar" value="img" checked>
                <label for="slct_img">Imagem</label>
                <input id="slct_ins" type="radio" name="selecionar" value="ins">
                <label for="slct_ins">Instruções</label>
                <input id="slct_ing" type="radio" name="selecionar" value="ing">
                <label for="slct_ing">Ingredientes</label>
            </form>

            <nav class="btns_result">
                <button class="btn_navegando">&lt;</button>
                <button class="btn_navegando">&gt;</button>
            </nav>
            <span id="n_resultados">Resultados:0</span>
            <span id="vendo_n_resultado">Exibindo:1°</span>
        </div>
    </main>
</body>
</html>
